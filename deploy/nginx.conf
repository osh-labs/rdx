# nginx site config for a private, Tailscale-only rdx instance.
#
# nginx listens on loopback ONLY. TLS termination and access control are
# handled by `tailscale serve`, which fronts this with a real Let's Encrypt
# certificate for the machine's <host>.<tailnet>.ts.net name:
#
#   sudo tailscale serve --bg --https=443 http://127.0.0.1:8080
#
# The EC2 security group needs no public inbound rule at all -- Tailscale is
# outbound-only (UDP 41641, falling back to DERP over 443).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/rdx.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/rdx;
    index index.html;

    access_log /var/log/nginx/rdx.access.log;
    error_log  /var/log/nginx/rdx.error.log;

    # Content Security Policy.
    #
    # 'unsafe-inline' for script-src is unavoidable without removing the inline
    # onclick= handlers throughout the pages, which is a larger refactor. The
    # part that carries the weight is connect-src: the OAuth refresh token
    # lives in localStorage, and restricting connect-src to Reddit means
    # injected script cannot exfiltrate it to an attacker-controlled host.
    #
    # No third-party origin is listed anywhere. dash.js is vendored, there are
    # no webfonts, and all analytics have been removed -- so a page load
    # reaches exactly two origins: this one and Reddit's.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://oauth.reddit.com https://www.reddit.com; img-src 'self' data: https://*.redd.it https://*.redditmedia.com; media-src 'self' blob: https://*.redd.it; frame-src https://www.redgifs.com https://redgifs.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header X-Frame-Options          "DENY" always;

    # The app is small and changes only on deploy; the HTML must not be cached
    # or a deploy leaves stale pages pinned in the browser.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # dash.js is 780 KB and versioned by content, so it can cache hard.
    location = /dash.all.min.js {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
