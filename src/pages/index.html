<script>
function doit(){
    document.getElementById('rightbar').innerHTML =
        '<a href="?sort=best">Best</a><a href="?sort=hot">Hot</a><a href="?sort=new">New</a>' +
        '<a href="?sort=rising">Rising</a><a href="?sort=top">Top</a>' +
        '<a href="?sort=top&t=week">Top (week)</a><a href="?sort=top&t=month">Top (month)</a>' +
        '<a onclick="shareit();" id="sharebutton">Share</a>';
    document.getElementById('pagetitletext').innerHTML = 'rdx';
    document.title = 'rdx';

    // Authenticated, this IS the account's front page. Upstream concatenated
    // r/sub1+sub2+sub3 from localStorage, which breaks once you have enough
    // subscriptions to exceed URL length limits.
    loadListing(function (o) { return api.frontPage(o); }, {
        sort: getget('sort') || 'best',
        t: getget('t'),
        after: getget('after'),
        before: getget('before'),
    });
}

doit();
</script>
